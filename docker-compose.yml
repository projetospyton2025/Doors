services:
  app:
    build: .
    container_name: doors-app
    environment:
      APP_ENV: production
      DEBUG: "false"
      APP_SECRET_KEY: ${APP_SECRET_KEY:-altere-esta-chave-em-producao}
      DATABASE_URL: sqlite:////app/data/doors.db
      DOORS_XLSX_PATH: /app/Doors-populada.xlsx
      ALLOWED_HOSTS: "*"
      APP_HOST: 0.0.0.0
      APP_PORT: "5333"
    volumes:
      - doors_data:/app/data
      - ./exports:/app/exports
    expose:
      - "5333"
    ports:
      - "5333:5333"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5333/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:1.27-alpine
    container_name: doors-nginx
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  doors_data:
